<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>Termark 本地解密工具</title>
<style>
  :root { color-scheme: light dark; --bg: #f1f4f3; --panel: #fff; --ink: #172722; --sub: #51645d; --border: #b8c8c0; --accent: #136047; --button-text: #fff; --error: #9e271f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #14201d; --panel: #1a2a24; --ink: #e7f0eb; --sub: #aec2b9; --border: #637a6f; --accent: #95e1be; --button-text: #13271e; --error: #ffb4a9; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 Inter, system-ui, "PingFang SC", sans-serif; }
  main { max-width: 700px; margin: 0 auto; padding: clamp(22px, 6vw, 60px) 18px; }
  h1 { font-size: clamp(25px, 6vw, 36px); margin: 0; line-height: 1.2; letter-spacing: -.02em; }
  header p { color: var(--sub); margin: 12px 0 25px; }
  form { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: clamp(16px, 5vw, 30px); }
  fieldset { padding: 0; margin: 0; border: 0; min-width: 0; }
  label { display: block; margin: 0 0 15px; font-weight: 600; }
  select, input, textarea { display: block; margin-top: 5px; width: 100%; min-height: 42px; background: var(--panel); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px 11px; font: inherit; font-weight: 400; }
  input[type=file] { padding: 6px; }
  textarea { resize: vertical; }
  textarea[readonly] { font-family: ui-monospace, monospace; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { display: block; color: var(--sub); font-weight: 400; font-size: .84rem; margin-top: 6px; overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  button { background: var(--accent); color: var(--button-text); font: inherit; font-weight: 650; border: 1px solid var(--accent); border-radius: 8px; padding: 8px 16px; cursor: pointer; }
  button.secondary { background: transparent; border-color: var(--border); color: var(--ink); }
  fieldset:disabled button { opacity: .55; cursor: wait; }
  #status { margin: 0; }
  #status:not(:empty) { margin-top: 16px; }
  .result { margin: 16px 0 0; }
  .error { display: block; color: var(--error); font-weight: 400; }
  details { margin-top: 19px; color: var(--sub); font-size: .86rem; }
  summary { cursor: pointer; }
  code { overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <header>
    <h1>Termark 本地解密工具</h1>
    <p>数据库、密钥和解密结果仅在当前浏览器页面处理。</p>
  </header>
  <form id="form" autocomplete="off">
    <fieldset id="controls">
      <label>解密来源
        <select id="source"><option value="database">Termark 数据库</option><option value="sync">同步快照（.dat）</option><option value="field">单个加密字段</option></select>
      </label>
      <div id="database-inputs">
        <label>数据库
          <input id="database" type="file" accept=".db,.bolt,.bbolt">
          <span class="hint">建议先退出 Termark，再选择 <code>termark.db</code> 的副本。</span>
        </label>
        <label>查找主机或凭证 <input id="filter" type="search" placeholder="名称或 IP 地址"></label>
        <label>要解密的记录 <select id="target"><option value="">请先选择数据库</option></select></label>
      </div>
      <div id="field-inputs" hidden>
        <label>密文字段 <textarea id="ciphertext" rows="3" placeholder="enc:v1:…" spellcheck="false"></textarea></label>
      </div>
      <div id="sync-inputs" hidden>
        <label>同步快照
          <input id="sync-file" type="file">
          <span class="hint">选择 Termark 同步文件（.dat 或 .json）。同步密码保存在钥匙串时，条目名为 <code>sync-passphrase</code>。</span>
        </label>
      </div>
      <label id="key-type">密钥类型
        <select id="mode">
          <option value="raw">32 字节本地数据密钥</option>
          <option value="passphrase">本地加密口令（从数据库读取派生参数）</option>
        </select>
      </label>
      <label><span id="secret-label">本地数据密钥</span>
        <input id="secret" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" required>
      </label>
      <div class="actions">
        <button type="submit">解密</button>
        <button class="secondary" id="clear" type="button">清除密钥和结果</button>
      </div>
    </fieldset>
    <p id="status" role="status"></p>
    <div id="results"></div>
  </form>
  <details>
    <summary>数据库和密钥在哪里</summary>
    <ul>
      <li>macOS 数据库通常位于 <code>~/Library/Application Support/Termark/backend/termark.db</code>。</li>
      <li>Windows 安装版通常位于 <code>%AppData%\Termark\backend</code>。Windows 便携版位于应用目录下的 <code>data</code>。</li>
      <li>系统凭据库的服务名为 <code>termark.app</code>。安装版的条目名为 <code>local-data-key</code>，便携版缓存的条目名为 <code>portable-local-data-key</code>。</li>
    </ul>
  </details>
</main>
